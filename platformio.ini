; PlatformIO Project Configuration
; IoT Water Tank Level Monitor — ESP32-C6 DevKitC-1 v1.2 + MAX98357A
; Generated by Antigravity (AGY)

[platformio]
src_dir = main

[env:esp32-c6-devkitc-1]
platform    = espressif32
board       = esp32-c6-devkitc-1
framework   = espidf

; Serial monitor speed
monitor_speed = 115200

; Lock to the UART port (CP210x bridge) — reliable serial, no USB re-enumeration
monitor_port = COM6

; Upload speed
upload_speed = 460800
upload_port = COM6

; Flash mode — DIO is compatible with the ESP32-C6 DevKitC-1
board_build.flash_mode = dio

; Flash size — DevKitC-1 v1.2 has 8 MB flash
board_build.flash_size = 8MB

; Custom partition table — 3 MB app region for WiFi + TLS + PCM audio
board_build.partitions = partitions.csv

; Serial monitor filters: decode panics, add timestamps, colorize ESP_LOG output
monitor_filters = esp32_exception_decoder, default, time, colorize

; Extra build flags — enable floating point math library for audio_clips.c
; (placeholder waveform values were pre-computed offline; no runtime math.h needed)
build_flags =
    -DCONFIG_ESP_MAIN_TASK_STACK_SIZE=4096
